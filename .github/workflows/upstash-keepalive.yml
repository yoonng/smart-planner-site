name: Upstash keep-alive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    name: Keep support rate-limit DB active
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Exercise production support rate limiter
        shell: bash
        run: |
          set -euo pipefail

          api_url="https://feathly-support-api.netlify.app/api/support"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          # The Support API checks Upstash rate limiting before parsing JSON.
          # Send intentionally malformed JSON so the request exercises Redis,
          # then stops before Turnstile verification or email delivery.
          http_code="$(curl --http1.1 --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            -o "$body_file" \
            -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://feathly.com' \
            -H 'Content-Type: application/json' \
            --data-binary '{' \
            "$api_url")"

          response="$(cat "$body_file")"

          if [[ "$http_code" == "400" ]] && jq -e '.code == "INVALID_JSON"' <<<"$response" >/dev/null; then
            echo "Upstash keep-alive succeeded through the production support rate limiter."
            echo "No support email was sent and no planner/user data was modified."
            exit 0
          fi

          # A 429 also proves that the Upstash-backed limiter was reached.
          if [[ "$http_code" == "429" ]] && jq -e '.code == "RATE_LIMITED"' <<<"$response" >/dev/null; then
            echo "Upstash keep-alive succeeded; the production support rate limiter returned 429."
            exit 0
          fi

          echo "::error::Unexpected Support API response (HTTP ${http_code})."
          echo "$response"
          exit 1
