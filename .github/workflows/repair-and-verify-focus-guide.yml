name: Repair and verify Focus guide

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  repair-and-verify:
    if: github.event.issue.title == '[automation] Repair and verify Focus guide'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image validation support
        run: python -m pip install --disable-pip-version-check pillow

      - name: Repair guide and validate source PNG files
        run: python scripts/repair-focus-guide.py

      - name: Remove one-time repair files
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/repair-focus-guide.py .github/workflows/repair-and-verify-focus-guide.yml

      - name: Commit repaired guide to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair Focus Timer guide images'
          git pull --rebase origin main
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Inspect and request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          echo '--- Pages configuration ---'
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true
          echo '--- Request Pages build ---'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
          exit 0

      - name: Verify live HTML and images
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://feathly.com/smart-planner/user-guide.html'
          IMAGES=(
            'https://feathly.com/assets/user-guide/en/menu/01-main-menu.png'
            'https://feathly.com/assets/user-guide/en/focus/01-setup.png'
            'https://feathly.com/assets/user-guide/en/focus/02-running.png'
          )

          found=0
          for attempt in $(seq 1 60); do
            stamp="${{ steps.publish.outputs.sha }}-${attempt}-$(date +%s)"
            echo "Attempt ${attempt}: ${PAGE}?deploy=${stamp}"
            body="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "${PAGE}?deploy=${stamp}" || true)"
            if grep -q 'data-focus-guide-build="20260804-verified-png"' <<<"$body"; then
              found=1
              echo 'Live HTML contains the repaired Focus guide marker.'
              break
            fi
            sleep 10
          done

          if [[ "$found" != '1' ]]; then
            echo 'Live page did not update within the verification window.'
            echo '--- Live response headers ---'
            curl --silent --show-error --location --head -H 'Cache-Control: no-cache' "${PAGE}?debug=$(date +%s)" || true
            exit 1
          fi

          for image in "${IMAGES[@]}"; do
            stamp="${{ steps.publish.outputs.sha }}-$(date +%s)"
            echo "Checking ${image}?deploy=${stamp}"
            headers="$(mktemp)"
            file="$(mktemp)"
            curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              -D "$headers" \
              -o "$file" \
              "${image}?deploy=${stamp}"
            cat "$headers"
            file "$file"
            python - "$file" <<'PY'
          import sys
          from PIL import Image
          path = sys.argv[1]
          with Image.open(path) as image:
              image.verify()
          with Image.open(path) as image:
              print(f"LIVE IMAGE OK: {image.format} {image.size[0]}x{image.size[1]}")
          PY
            rm -f "$headers" "$file"
          done
