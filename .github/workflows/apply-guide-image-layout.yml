name: Apply guide image layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-guide-image-layout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add responsive Home screenshot layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/user-guide.css')
          text = p.read_text(encoding='utf-8')
          marker = '/* Home guide screenshot presentation */'
          if marker not in text:
              text += '''\n\n/* Home guide screenshot presentation */\n#home .guide-shot {\n  width: min(100%, 430px);\n  margin: 22px auto 30px;\n  padding: 14px;\n  background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);\n  border-color: #dbe4ef;\n  box-shadow: 0 18px 46px rgba(15, 23, 42, 0.10);\n}\n\n#home .guide-shot img {\n  width: 100%;\n  height: auto;\n  border-radius: 14px;\n  border: 1px solid #e2e8f0;\n  background: #ffffff;\n}\n\n#home .guide-shot figcaption {\n  margin: 14px -14px -14px;\n  padding: 14px 18px 16px;\n  text-align: center;\n}\n\n@media (min-width: 1000px) {\n  #home .guide-shot {\n    width: min(100%, 400px);\n  }\n}\n\n@media (max-width: 520px) {\n  #home .guide-shot {\n    width: 100%;\n    padding: 8px;\n    border-radius: 18px;\n    margin: 16px auto 22px;\n  }\n\n  #home .guide-shot img {\n    border-radius: 12px;\n  }\n\n  #home .guide-shot figcaption {\n    margin: 10px -8px -8px;\n    padding: 12px 14px 14px;\n  }\n}\n'''
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit layout update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/user-guide.css
          if git diff --cached --quiet; then
            echo "No layout changes needed."
            exit 0
          fi
          git commit -m "Improve user guide screenshot sizing"
          git push origin main
