name: Fix Routine guide highlight boxes

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix-guide:
    if: github.event.issue.title == '[automation] Fix Routine highlight boxes'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Correct Routine guide highlights
        run: python scripts/fix-routine-highlight-boxes.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-planner/user-guide.html assets/user-guide-visuals.css
          git commit -m 'Correct Routine guide highlight regions'
          git pull --rebase origin main
          git push origin main
