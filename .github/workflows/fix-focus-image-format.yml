name: Fix Focus image format

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  fix-image:
    if: github.event.issue.title == '[automation] Fix Focus image format'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image support
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate and convert Focus image
        run: python scripts/fix-focus-image-format.py

      - name: Remove one-time files and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/fix-focus-image-format.py .github/workflows/fix-focus-image-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Focus Timer guide image delivery'
          git pull --rebase origin main
          git push origin main
