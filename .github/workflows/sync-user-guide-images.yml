name: Publish user guide images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-user-guide-images.yml'
      - 'assets/user-guide/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-local-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Verify required images
        run: |
          test -f assets/user-guide/B_after_create.png
          test -f assets/user-guide/B_after_create2.png
          test -f assets/user-guide/B_after_create3.gif

      - name: Switch manual to public local image paths
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('smart-planner/user-guide.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'https://raw.githubusercontent.com/yoonng/feathly-smart-planner/main/manual/0.9/ko/screenshots/B_after_create.png': '/assets/user-guide/B_after_create.png',
              'https://raw.githubusercontent.com/yoonng/feathly-smart-planner/main/manual/0.9/ko/screenshots/B_after_create2.png': '/assets/user-guide/B_after_create2.png',
              'https://raw.githubusercontent.com/yoonng/feathly-smart-planner/main/manual/0.9/ko/screenshots/B_after_create3.gif': '/assets/user-guide/B_after_create3.gif',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit manual changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-planner/user-guide.html
          if git diff --cached --quiet; then
            echo "Manual already uses local image paths."
            exit 0
          fi
          git commit -m "Use published guide screenshots"
          git push origin main

  optional-sync-from-private-source:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Check out private source repository
        uses: actions/checkout@v4
        with:
          repository: yoonng/feathly-smart-planner
          ref: main
          token: ${{ secrets.SMART_PLANNER_SITE_PAT }}
          path: source

      - name: Copy current source screenshots
        run: |
          mkdir -p assets/user-guide
          cp source/manual/0.9/ko/screenshots/B_after_create.png assets/user-guide/B_after_create.png
          cp source/manual/0.9/ko/screenshots/B_after_create2.png assets/user-guide/B_after_create2.png
          cp source/manual/0.9/ko/screenshots/B_after_create3.gif assets/user-guide/B_after_create3.gif

      - name: Commit changed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/user-guide
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "Sync guide screenshots from app repository"
          git pull --rebase origin main
          git push origin main
