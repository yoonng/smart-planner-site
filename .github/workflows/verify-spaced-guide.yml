name: Verify deployed Spaced Loop guide

on:
  pull_request:
    branches:
      - main
    paths:
      - .verify-spaced-guide
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify live guide and screenshots
        shell: bash
        run: |
          set -euo pipefail
          page_url="https://feathly.com/smart-planner/user-guide.html?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          page_file="/tmp/user-guide.html"

          for attempt in $(seq 1 30); do
            echo "Live verification attempt ${attempt}/30"
            if curl -fsSL -H 'Cache-Control: no-cache' "$page_url" -o "$page_file" \
              && grep -q 'spaced-quick-summary' "$page_file" \
              && grep -q 'Tap + Spaced Loop' "$page_file" \
              && grep -q '/assets/user-guide/spaced/04-save.png' "$page_file"; then
              echo "Updated Spaced Loop guide is live."
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Updated Spaced Loop guide was not visible within the verification window."
              exit 1
            fi
            sleep 10
          done

          mkdir -p /tmp/spaced-guide
          for image in 01-start.png 02-content.png 03-pattern.png 04-save.png; do
            asset_url="https://feathly.com/assets/user-guide/spaced/${image}?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            target="/tmp/spaced-guide/${image}"
            curl -fsSL -H 'Cache-Control: no-cache' "$asset_url" -o "$target"
            test "$(wc -c < "$target")" -gt 10000
            file "$target" | tee /tmp/file-result.txt
            grep -q 'PNG image data' /tmp/file-result.txt
          done

          echo "Live HTML and all four Cursor screenshots verified successfully."

      - name: Render Spaced Loop section from deployed source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/smart-planner/user-guide.html >/dev/null; then
              break
            fi
            sleep 1
          done

          google-chrome --version
          google-chrome \
            --headless \
            --disable-gpu \
            --no-sandbox \
            --hide-scrollbars \
            --window-size=1440,1800 \
            --run-all-compositor-stages-before-draw \
            --virtual-time-budget=5000 \
            --screenshot=/tmp/spaced-guide-render.png \
            "http://127.0.0.1:8000/smart-planner/user-guide.html#spaced-loop"
          test -s /tmp/spaced-guide-render.png
          file /tmp/spaced-guide-render.png

      - name: Upload visual check
        uses: actions/upload-artifact@v4
        with:
          name: spaced-guide-render-check
          path: /tmp/spaced-guide-render.png
          retention-days: 1
