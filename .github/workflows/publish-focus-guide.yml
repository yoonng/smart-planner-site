name: Publish Focus Timer guide

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  publish-guide:
    if: github.event.issue.title == '[automation] Publish Focus Timer guide'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download approved Focus Timer composite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/user-guide/en/focus
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          url = 'https://api.github.com/repos/yoonng/smart-planner-site/git/blobs/15cd176ddd8b9bcef0c74274eaa9c5e8ca58d760'
          request = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          Path('assets/user-guide/en/focus/focus-timer-flow.webp').write_bytes(
              base64.b64decode(payload['content'])
          )
          PY

      - name: Update English manual
        run: python scripts/publish-focus-guide.py

      - name: Remove one-time files and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/publish-focus-guide.py .github/workflows/publish-focus-guide.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish complete Focus Timer guide flow'
          git pull --rebase origin main
          git push origin main
