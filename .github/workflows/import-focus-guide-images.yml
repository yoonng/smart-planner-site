name: Import Focus guide images

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import-images:
    if: github.event.issue.title == '[automation] Import Focus guide images'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out private app repository
        uses: actions/checkout@v4
        with:
          repository: yoonng/feathly-smart-planner
          ref: main
          token: ${{ secrets.SMART_PLANNER_SITE_PAT }}
          path: _source

      - name: Copy Focus guide images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/user-guide/en/menu assets/user-guide/en/focus
          cp _source/manual/0.9/en/screenshots/main-manu.png assets/user-guide/en/menu/01-main-menu.png
          cp _source/manual/0.9/en/screenshots/FocusTimer.png assets/user-guide/en/focus/01-setup.png
          cp _source/manual/0.9/en/screenshots/FocusTimer-Startup.png assets/user-guide/en/focus/02-running.png
          rm -rf _source

      - name: Commit imported images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/user-guide/en/menu/01-main-menu.png assets/user-guide/en/focus/01-setup.png assets/user-guide/en/focus/02-running.png
          git commit -m 'Import Focus Timer guide images'
          git pull --rebase origin main
          git push origin main
