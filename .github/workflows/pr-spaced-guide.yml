name: PR Spaced Loop guide publisher

on:
  pull_request:
    branches:
      - main
    paths:
      - .guide-pr-trigger
      - .guide-pr-trigger-2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download verified Cursor screenshots
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-79c0-8209-b40c-19d1e35fc2f2/raw?se=2026-08-03T12:26:34Z&sp=r&sv=2026-02-06&sr=b&scid=5e302ea5-4fe6-5eef-9224-3e0f30b2e2b2&skoid=0556a536-9b18-4aa8-bae0-70ed682ee936&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T11:02:13Z&ske=2026-08-04T11:02:13Z&sks=b&skv=2026-02-06&sig=ei6QPGeT7SGsc3X0FfzZ28SPYaYQUL7KOLx/pAzAICA%3D' -o screenshots.zip
          mkdir -p assets/user-guide/spaced
          unzip -o screenshots.zip -d assets/user-guide/spaced
          test -f assets/user-guide/spaced/01-start.png
          test -f assets/user-guide/spaced/02-content.png
          test -f assets/user-guide/spaced/03-pattern.png
          test -f assets/user-guide/spaced/04-save.png

      - name: Build guide
        run: python scripts/build_spaced_guide.py

      - name: Commit and push to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/user-guide/spaced assets/user-guide.css smart-planner/user-guide.html
          if git diff --cached --quiet; then
            echo "Guide already current"
            exit 0
          fi
          git commit -m "Publish beginner Spaced Loop guide"
          git push origin HEAD:main
