name: Update Focus guide

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  update-guide:
    if: github.event.issue.title == '[automation] Update Focus guide'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Focus Timer manual section
        run: python scripts/update-focus-guide.py

      - name: Remove one-time files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/update-focus-guide.py .github/workflows/update-focus-guide.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document Focus Timer setup and running flow'
          git pull --rebase origin main
          git push origin main
