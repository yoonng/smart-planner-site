name: Publish final Focus Timer four-step guide

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  issues: write

jobs:
  publish-and-verify:
    if: github.event.issue.title == '[automation] Publish final Focus Timer four-step guide'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_PAGE: 'https://feathly.com/smart-planner/user-guide.html'
      LIVE_IMAGE: 'https://feathly.com/assets/user-guide/en/focus/focus-timer-flow.jpg'

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install image validation support
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate the directly uploaded approved image
        shell: bash
        run: |
          set -euo pipefail
          file assets/user-guide/en/focus/focus-timer-flow.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('assets/user-guide/en/focus/focus-timer-flow.jpg')
          if path.stat().st_size < 50_000:
              raise SystemExit(f'Image is unexpectedly small: {path.stat().st_size} bytes')
          with Image.open(path) as image:
              image.verify()
          with Image.open(path) as image:
              if image.format != 'JPEG':
                  raise SystemExit(f'Expected JPEG, got {image.format}')
              if image.width < 1000 or image.height < 700:
                  raise SystemExit(f'Unexpected dimensions: {image.size}')
              print(f'APPROVED IMAGE OK: {image.format} {image.width}x{image.height}, {path.stat().st_size} bytes')
          PY

      - name: Replace the English Focus Timer section
        run: python scripts/publish-final-focus-flow.py

      - name: Remove one-time publishing files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            scripts/publish-final-focus-flow.py \
            .github/workflows/publish-final-focus-flow.yml \
            deploy-20260804-final-focus-flow.txt \
            deploy-20260804-final-focus-flow-2.txt \
            .final-focus-ready \
            .final-focus-trigger \
            .trigger-final-four-step

      - name: Commit and push to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Publish final four-step Focus Timer guide'
          git pull --rebase origin main
          git push origin main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          exit 0

      - name: Verify the deployed four-step guide
        shell: bash
        run: |
          set -euo pipefail
          marker='data-focus-guide-build="20260804-final-four-step"'
          deployed=0
          for attempt in $(seq 1 60); do
            stamp="${{ steps.publish.outputs.sha }}-${attempt}-$(date +%s)"
            echo "Verification attempt ${attempt}"
            curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' \
              "${LIVE_PAGE}?deploy=${stamp}" \
              -o /tmp/live-focus-page.html
            if grep -q "$marker" /tmp/live-focus-page.html; then
              deployed=1
              break
            fi
            sleep 10
          done
          if [[ "$deployed" != '1' ]]; then
            echo 'The final four-step HTML was not deployed in time.'
            exit 1
          fi

          stamp="${{ steps.publish.outputs.sha }}-image-$(date +%s)"
          curl --fail --silent --show-error --location \
            -H 'Cache-Control: no-cache' \
            -D /tmp/live-focus-image.headers \
            "${LIVE_IMAGE}?deploy=${stamp}" \
            -o /tmp/live-focus-image.jpg
          cat /tmp/live-focus-image.headers
          file /tmp/live-focus-image.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('/tmp/live-focus-image.jpg')
          with Image.open(path) as image:
              image.verify()
          with Image.open(path) as image:
              if image.format != 'JPEG':
                  raise SystemExit(f'Live image format is {image.format}, expected JPEG')
              if image.width < 1000 or image.height < 700:
                  raise SystemExit(f'Live image dimensions are wrong: {image.size}')
              print(f'LIVE FOUR-STEP IMAGE OK: {image.format} {image.width}x{image.height}, {path.stat().st_size} bytes')
          PY

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
