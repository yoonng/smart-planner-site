name: Rerun beginner Spaced Loop guide

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rerun-spaced-guide.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Check out app screenshots
        uses: actions/checkout@v4
        with:
          repository: yoonng/feathly-smart-planner
          ref: main
          token: ${{ secrets.SMART_PLANNER_SITE_PAT }}
          path: source

      - name: Copy verified Cursor captures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/user-guide/spaced
          cp source/manual/0.9/en/screenshots/BEGINNER-03_en_light_phone_v2.png assets/user-guide/spaced/01-start.png
          cp source/manual/0.9/en/screenshots/BEGINNER-04_top_en_light_phone_v2.png assets/user-guide/spaced/02-content.png
          cp source/manual/0.9/en/screenshots/BEGINNER-04_mid_en_light_phone_v2.png assets/user-guide/spaced/03-pattern.png
          cp source/manual/0.9/en/screenshots/BEGINNER-04_bottom_en_light_phone_v2.png assets/user-guide/spaced/04-save.png

      - name: Commit screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/user-guide/spaced
          if git diff --cached --quiet; then
            echo "Screenshots already current"
            exit 0
          fi
          git commit -m "Publish verified Spaced Loop screenshots"
          git push origin main

# Triggered after repository token permissions were updated.
