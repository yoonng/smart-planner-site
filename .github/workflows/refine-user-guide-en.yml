name: Refine English user guide

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  refine-guide:
    if: github.event.issue.title == '[automation] Refine English user guide'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refine manual structure and remove duplicate images
        run: python scripts/refine-user-guide-en.py

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine English guide screenshots and Routine steps'
          git pull --rebase origin main
          git push origin main
