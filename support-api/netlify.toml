[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/support"
  to = "/.netlify/functions/support"
  status = 200
  force = true

[[redirects]]
  from = "/api/closed-test"
  to = "/.netlify/functions/closed-test"
  status = 200
  force = true
